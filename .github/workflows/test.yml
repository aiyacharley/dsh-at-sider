name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies and no build step: the Client artifact is authored
      # directly in the browser module-loader format, so the suite runs as-is.
      - name: Run test suite
        run: node scripts/run-tests.mjs
